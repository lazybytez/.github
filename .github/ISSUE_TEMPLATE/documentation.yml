name: Documentation Improvement
description: Suggest an improvement or addition to documentation
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping us improve our documentation.
  - type: textarea
    id: description
    attributes:
      label: What Needs Improvement
      description: Describe what documentation is missing, unclear, or incorrect.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested Changes
      description: If you have specific suggestions, describe them here.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context, links, or screenshots.
    validations:
      required: false
